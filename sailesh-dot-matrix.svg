<style>
.highlight{animation:sweep 7s ease-in-out infinite}
.float{animation:float 7s ease-in-out infinite}
@keyframes sweep{0%,15%{transform:translateX(-240px)}70%,100%{transform:translateX(1200px)}}
@keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.highlight,.float{animation:none}.highlight{opacity:0}}
</style>
